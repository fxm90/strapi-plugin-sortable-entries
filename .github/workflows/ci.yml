name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: Verify plugin
        run: npm run verify

      - name: Type-check
        run: |
          npx tsc -p server/tsconfig.json --noEmit
          npx tsc -p admin/tsconfig.json --noEmit

      - name: Run tests
        run: npx vitest run
